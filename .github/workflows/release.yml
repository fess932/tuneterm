name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          staging="tuneterm-${{ matrix.target }}"
          mkdir -p "$staging"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/tuneterm.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/tuneterm" "$staging/"
          fi
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          if command -v shasum >/dev/null; then
            shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
          else
            sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tuneterm-${{ matrix.target }}
          path: |
            tuneterm-${{ matrix.target }}.tar.gz
            tuneterm-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    # Only publish a Release for an actual tag; workflow_dispatch just builds.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
