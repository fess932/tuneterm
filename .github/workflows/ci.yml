name: CI

# One run per push: the checks, then — on main and on `v*` tags, and only if every
# check passed — the server image, published to ghcr.io/fess932/tuneterm.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

# A newer push to the same branch makes an older run pointless — and the same
# commit arriving twice would otherwise run everything twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # rodio needs ALSA to build on Linux. souvlaki uses its pure-Rust zbus
      # backend, so no libdbus is required.
      - name: Install ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo build --verbose

      # The server alone, as the Docker image builds it: no player, no ALSA.
      - run: cargo clippy --no-default-features --all-targets -- -D warnings

      # The tests open an audio device; give Linux a dummy one.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y alsa-utils
          sudo modprobe snd-dummy || true
          cargo test --verbose
        continue-on-error: true

      # macOS has a real audio device; Windows runners do not, so the audio tests
      # there are informational.
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: cargo test --verbose

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --verbose
        continue-on-error: true

  proto:
    name: buf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          # Nothing is deployed that an older schema would have to keep talking to.
          breaking: false
          push: false

  # Each architecture builds on a native runner — compiling Rust under QEMU takes
  # several times as long — and is pushed by digest; `image` then tags the two
  # together as one multi-arch image.
  image-build:
    name: image ${{ matrix.platform }}
    needs: [check, proto]
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest only; the tags go on in `image`, once both exist.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Keep the digest
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"
          echo "PLATFORM_PAIR=$(echo '${{ matrix.platform }}' | tr / -)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: digests/*
          retention-days: 1

  image:
    needs: image-build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Tag both architectures together
        working-directory: digests
        # Unquoted on purpose: each expands to several arguments.
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
