name: CI

# One run per push. The checks first; then, only if every one passed, the server
# image (main and `v*` tags, published to ghcr.io/fess932/tuneterm) and, for a
# `v*` tag, the binaries and the GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

# A newer push to the same branch makes an older run pointless — and the same
# commit arriving twice would otherwise run everything twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # rodio needs ALSA to build on Linux. souvlaki uses its pure-Rust zbus
      # backend, so no libdbus is required.
      - name: Install ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo build --verbose

      # The server alone, as the Docker image builds it: no player, no ALSA.
      - run: cargo clippy --no-default-features --all-targets -- -D warnings

      # The tests open an audio device; give Linux a dummy one.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y alsa-utils
          sudo modprobe snd-dummy || true
          cargo test --verbose
        continue-on-error: true

      # macOS has a real audio device; Windows runners do not, so the audio tests
      # there are informational.
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: cargo test --verbose

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --verbose
        continue-on-error: true

  proto:
    name: buf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          # Nothing is deployed that an older schema would have to keep talking to.
          breaking: false
          push: false

  # Each architecture builds on a native runner — compiling Rust under QEMU takes
  # several times as long — and is pushed by digest; `image` then tags the two
  # together as one multi-arch image.
  image-build:
    name: image ${{ matrix.platform }}
    needs: [check, proto]
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest only; the tags go on in `image`, once both exist.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Keep the digest
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"
          echo "PLATFORM_PAIR=$(echo '${{ matrix.platform }}' | tr / -)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: digests/*
          retention-days: 1

  image:
    needs: image-build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Tag both architectures together
        working-directory: digests
        # Unquoted on purpose: each expands to several arguments.
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # Binaries for every platform, on a `v*` tag — or by hand, to try the packaging
  # without publishing anything.
  release-build:
    name: release ${{ matrix.target }}
    needs: [check, proto]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          staging="tuneterm-${{ matrix.target }}"
          mkdir -p "$staging"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/tuneterm.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/tuneterm" "$staging/"
          fi
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          if command -v shasum >/dev/null; then
            shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
          else
            sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tuneterm-${{ matrix.target }}
          path: |
            tuneterm-${{ matrix.target }}.tar.gz
            tuneterm-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: release-build
    # Only publish a Release for an actual tag; workflow_dispatch just builds.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
