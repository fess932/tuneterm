# docker compose up -d        (or: podman compose up -d)
#
# Change the token, and point the volume at the music. Without a token the server
# is open to anyone and read-only.

services:
  tuneterm:
    build: .
    image: tuneterm-server
    restart: unless-stopped
    ports:
      - "7700:7700"
    volumes:
      - "./music:/music"
    environment:
      TUNETERM_TOKEN: "TOKEN"
