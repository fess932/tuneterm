# docker compose up -d        (or: podman compose up -d)
#
# Put the settings in a .env file next to this one:
#
#   MUSIC=/path/to/music
#   TUNETERM_TOKEN=something-long      # leave out for an open, read-only server
#   PUID=1000                          # `id -u`: uploads are owned by this user
#   PGID=1000                          # `id -g`

services:
  tuneterm:
    build: .
    image: tuneterm-server
    restart: unless-stopped
    ports:
      - "7700:7700"
    volumes:
      - "${MUSIC:-./music}:/music"
    environment:
      TUNETERM_TOKEN: "${TUNETERM_TOKEN:-}"
    user: "${PUID:-1000}:${PGID:-1000}"
